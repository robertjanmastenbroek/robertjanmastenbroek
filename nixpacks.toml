# Railway build config for robertjanmastenbroek.com
#
# This is a mixed Node + Python repo. Nixpacks auto-detection can get
# confused (500+ Python files in content_engine/ + outreach_agent/).
# This file explicitly pins to Node.js.
#
# Build optimizations (2026-06-03):
# - Cache enabled: npm dependencies survive between deploys
# - npm ci with --no-audit: faster install, no security audit (not needed
#   in production, only slows the build)
# - Deploy filter: exclude Python-heavy dirs from the build context
#   (content_engine/, outreach_agent/, ruflo/, continuous-claude/)

[cache]
key = "npm-cache-{{ .NIXPACKS_COMMIT_SHA }}"
paths = ["node_modules"]

[phases.setup]
nixPkgs = ["nodejs_20", "npm-10_x"]

[phases.install]
cmds = ["npm ci --no-audit --no-fund"]

[phases.build]
cmds = ["echo 'no build step — Node server runs from source'"]

[deploy]
# Exclude Python-heavy directories and log/workspace files from deploy
# context — they slow down the build but aren't needed at runtime.
exclude = [
  "content_engine/",
  "outreach_agent/",
  "ruflo/",
  "continuous-claude/",
  "logs/",
  "**/node_modules/**",
]

[start]
cmd = "node server.js"

[variables]
NODE_ENV = "production"
