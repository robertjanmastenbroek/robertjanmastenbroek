<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Holy Rave</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#0a0a0a; color:#f5f1e8;
      font-family:'Inter',-apple-system,sans-serif;
      font-weight:300; min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      padding:2rem;
    }
    .card {
      background:#121216; border:1px solid rgba(200,136,58,0.18);
      padding:3rem 2.5rem; width:100%; max-width:400px;
      position:relative;
    }
    .card::before {
      content:''; position:absolute; top:0; left:0; right:0;
      height:2px; background:linear-gradient(90deg,transparent,#c8883a,transparent);
    }
    .card h1 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:400; font-size:1.8rem; margin-bottom:0.3rem; }
    .card h1 em { color:#c8883a; font-style:italic; }
    .card .sub { color:#7a7266; font-size:0.85rem; margin-bottom:2rem; }
    .field { margin-bottom:1rem; }
    .field label { display:block; font-size:0.7rem; letter-spacing:0.18em; text-transform:uppercase; color:#7a7266; margin-bottom:0.3rem; }
    .field input {
      width:100%; padding:0.8rem 1rem;
      background:rgba(10,10,10,0.6); border:1px solid rgba(200,136,58,0.15);
      color:#f5f1e8; font-family:'Inter',sans-serif; font-size:0.9rem;
      outline:none; transition:border-color 0.2s;
    }
    .field input:focus { border-color:#c8883a; }
    .field-row { display:flex; gap:0.75rem; }
    .field-row .field { flex:1; }
    .btn {
      width:100%; padding:0.9rem; margin-top:1rem;
      border:none; color:#0a0a0a;
      font-family:'Inter',sans-serif; font-size:0.76rem;
      font-weight:700; letter-spacing:0.24em; text-transform:uppercase;
      cursor:pointer; transition:all 0.3s;
      display:flex; align-items:center; justify-content:center; gap:0.6rem;
    }
    .btn-primary { background:#d4af37; }
    .btn-primary:hover { background:#b8532a; color:#fff; }
    .btn-google {
      background:transparent; color:#c9c4b6;
      border:1px solid rgba(200,136,58,0.25);
    }
    .btn-google:hover { background:rgba(200,136,58,0.12); border-color:#c8883a; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .btn svg { width:18px; height:18px; }
    .divider { display:flex; align-items:center; gap:1rem; margin:1.25rem 0; color:#7a7266; font-size:0.72rem; letter-spacing:0.12em; }
    .divider .line { height:1px; flex:1; background:rgba(200,136,58,0.1); }
    .error { color:#b8532a; font-size:0.78rem; min-height:1.2rem; margin-top:0.5rem; text-align:center; }
    .foot { text-align:center; margin-top:1.5rem; font-size:0.82rem; color:#7a7266; }
    .foot a { color:#c8883a; text-decoration:none; }
    .foot a:hover { color:#d4af37; }
    .success { color:#4ade80; font-size:0.85rem; text-align:center; margin-top:0.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create <em>Account</em></h1>
    <p class="sub">Join Holy Rave — one account for all events</p>

    <button class="btn btn-google" onclick="signUpGoogle()">
      <svg viewBox="0 0 24 24" style="width:18px;height:18px;"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <div class="divider"><span class="line"></span> or <span class="line"></span></div>

    <div class="field-row">
      <div class="field"><label>First Name</label><input type="text" id="firstName" placeholder="John"></div>
      <div class="field"><label>Last Name</label><input type="text" id="lastName" placeholder="Doe"></div>
    </div>
    <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@email.com" autocomplete="email"></div>
    <div class="field"><label>Password</label><input type="password" id="password" placeholder="Min 6 characters" autocomplete="new-password"></div>
    <div class="error" id="error"></div>
    <div class="success" id="success" style="display:none;">Check your email for a confirmation link.</div>
    <button class="btn btn-primary" id="signupBtn" onclick="signUpEmail()">Create Account</button>
    <p class="foot">Already have one? <a href="/auth/login">Sign in</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    let supabaseClient = null;

    async function getSupabase() {
      if (supabaseClient) return supabaseClient;
      const r = await fetch('/api/auth/config');
      const { url, key } = await r.json();
      if (!url || !key) throw new Error('Auth not configured');
      const { createClient } = globalThis.supabase;
      supabaseClient = createClient(url, key);
      return supabaseClient;
    }

    async function signUpGoogle() {
      const sb = await getSupabase();
      if (!sb) return;
      await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/auth/callback' } });
    }

    async function signUpEmail() {
      const first = document.getElementById('firstName').value.trim();
      const last = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const error = document.getElementById('error');
      const success = document.getElementById('success');
      const btn = document.getElementById('signupBtn');

      if (!first || !last || !email || !password) { error.textContent = 'Fill in all fields.'; return; }
      if (password.length < 6) { error.textContent = 'Password must be at least 6 characters.'; return; }

      btn.textContent = 'Creating...'; btn.disabled = true; error.textContent = ''; success.style.display = 'none';

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, firstName: first, lastName: last }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Signup failed');
        success.style.display = 'block';
        btn.textContent = 'Created!';
      } catch (err) {
        error.textContent = err.message;
        btn.textContent = 'Create Account'; btn.disabled = false;
      }
    }
  </script>
</body>
</html>
